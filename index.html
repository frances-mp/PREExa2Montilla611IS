<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUMON | Tips de Inteligencia Artificial Generativa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0077c8 0%, #004b87 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            max-width: 650px;
            width: 92%;
            padding: 2.5rem;
            text-align: center;
        }
        .brand-badge {
            background-color: #e6f3fc;
            color: #0077c8;
            font-weight: 700;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }
        .btn-kumon {
            background-color: #0077c8;
            color: #ffffff;
            font-weight: 600;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            border: none;
            transition: background-color 0.2s ease;
        }
        .btn-kumon:hover {
            background-color: #005fa3;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="hero-card">
        <span class="brand-badge">KUMON &bull; INNOVACIÓN EDUCATIVA</span>
        <h1 class="fw-bold text-dark mb-3">Catálogo de Tips de IA Generativa</h1>
        <p class="text-secondary mb-4">
            Consulta estrategias prácticas, recomendaciones y buenas prácticas para potenciar el aprendizaje autónomo mediante herramientas de Inteligencia Artificial.
        </p>
        <a href="principal.jsp" class="btn btn-kumon btn-lg w-100 w-sm-auto">
            Explorar Catálogo de Tips
        </a>
    </div>
</body>
</html>
